<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140a10" />
  <meta name="description" content="for M ♡ from Ashu — a digital love letter." />
  <title>for M ♡ from Ashu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Petal/particle canvas -->
  <canvas id="petal-canvas" class="fx-canvas" aria-hidden="true"></canvas>

  <!-- Big M background -->
  <div class="m-bg" aria-hidden="true">
    <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mRoseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f4b6c2" />
          <stop offset="50%" stop-color="#e28c9d" />
          <stop offset="100%" stop-color="#b45067" />
        </linearGradient>
      </defs>
      <text x="50%" y="55%" dominant-baseline="central" text-anchor="middle"
            font-family="'Cormorant Garamond',Georgia,serif" font-size="680" font-weight="700"
            fill="url(#mRoseGradient)" opacity="1">M</text>
    </svg>
  </div>

  <!-- Custom cursor -->
<div id="cursor-dot" class="cursor-dot" aria-hidden="true">
    <i class="fa-solid fa-heart"></i>
</div>
  <div id="cursor-ring" class="cursor-ring" aria-hidden="true">
    <i class="fa-regular fa-heart"></i>
</div>

  <!-- Cat fullscreen prompt -->
  <div id="cat-modal" class="cat-modal" hidden>
    <div class="cat-card">
      <video id="cat-gif" autoplay muted loop playsinline>
        <source src="assets/source.mp4" type="video/mp4">
      </video>
      <h4>please open full screen babe...</h4>
      <p>it looks so much prettier when you can see the whole thing</p>
      <div class="cat-btns">
        <button class="btn btn-primary" id="cat-fs-btn"><i class="fa-solid fa-expand"></i> open fullscreen</button>
        <button class="btn btn-ghost" id="cat-dismiss-btn">not now</button>
      </div>
    </div>
  </div>

  <!-- Top bar (shown after main unlock) -->
  <header class="topbar" id="topbar" hidden>
    <div class="brand" id="brand-home">
      <i class="fa-solid fa-heart"></i>
      <span>for <em>Maha</em>, from Ashu</span>
    </div>
    <nav class="nav-btns" id="nav-btns"></nav>
  </header>

  <!-- All pages render here -->
  <main id="app" class="view"></main>



  <!-- Toast -->
  <div id="toast-el" class="toast" hidden></div>


  <!-- Scripts -->
  <script src="canvas-effects.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
